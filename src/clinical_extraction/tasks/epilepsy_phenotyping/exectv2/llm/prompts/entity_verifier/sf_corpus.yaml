clinical_rules:
- Return only SeizureFrequency mentions. Do not emit Diagnosis or Prescription.
- Every final evidence value must be an exact substring of the letter.
- 'Text may be a normalized clean seizure/event type anchor phrase even when the source has a typo. Evidence
  must remain exact. Example: source ''tonic chronic seizures'' may have text ''tonic clonic seizures''.'
- Do not emit CUI or CUIPhrase; projection is a deterministic layer.
- 'Clinical headline scoring cares about seizure/event type plus state: active-rate when a nonzero count/range
  is present, seizure-free when NumberOfSeizures is 0, and unknown when only FrequencyChange is present.'
- Use the clean scored seizure anchor as text, not the numeric or temporal fragment. For generic seizure
  rates use text 'seizures' or 'seizure'; for 'a total of 3 in 2020' in a seizure paragraph use text 'seizures',
  not '3 in 2020'.
- When a sentence states a generic seizure state change such as 'seizures have returned', emit text 'seizure'
  or 'seizures' with FrequencyChange='Increased'.
- When one evidence span contains two explicit seizure-free anchors, such as no further seizures since
  last clinic and since starting a drug, emit two generic seizure-free mentions with the same evidence
  but different PointInTime values.
- Apply a named-seizure-frequency gate. Emit SF only when the evidence itself gives a named seizure type,
  generic seizure(s), or seizure-free state together with a rate, count, last-event/seizure-free target,
  or frequency-change word. Do not infer SF from diagnosis text alone.
- Do not turn an active historical count into seizure-free just because the patient currently remains
  seizure free. Keep the historical active count and omit current seizure-free unless the source separately
  gives a seizure-free duration or point-in-time target annotated by the scheme.
- Do not emit a current generic 'seizure free' mention from bare phrases such as 'remains seizure free'
  unless the source gives an annotated duration, date, age range, or point-in-time target.
- Never use 'unknown' as NumberOfSeizures, LowerNumberOfSeizures, or UpperNumberOfSeizures. If there is
  no count, use a valid FrequencyChange category or omit the mention.
- In a 'last event X. Previous event Y' header, render the last-event seizure-free state only. Do not
  add the previous event as an active-rate mention.
- Do not emit a separate generic seizure active-rate for 'last had a seizure before this around a year
  ago'; that is a previous-event reference, not a rate.
- For 'several' use NumberOfSeizures='3'; for 'a few' use NumberOfSeizures='2'.
- For 'a few seizures per year', render generic seizures as NumberOfSeizures='2', NumberOfTimePeriods='1',
  TimePeriod='Year'.
- 'For every 3 to 4 weeks, render one seizure per 3-4 Week period: NumberOfSeizures=''1'', LowerNumberOfTimePeriods=''3'',
  UpperNumberOfTimePeriods=''4'', TimePeriod=''Week''.'
- Do not deduplicate separately supported SF mentions. If a seizure-type line and a later narrative repeat
  the same frequency statement, return both mentions with separate evidence.
- Do not emit SF for a single diagnostic event without ongoing frequency context, such as 'single focal
  seizure'.
- Do not emit SF for generic episodes, dizzy spells, or aura descriptions unless a named seizure type
  and frequency state are explicitly stated.
- Do not convert unlabelled 'episodes', 'events', 'blackouts', or 'loss of consciousness' counts into
  SeizureFrequency, even if nearby prose later says they may be seizures.
- Do not infer a named seizure type from an unlabelled episodes/events rate. If the rate sentence says
  only 'episodes' or 'events', omit it.
- Do not emit SF for 'continues to get' a named seizure type when there is no rate, count, seizure-free
  target, or frequency-change category.
- Do not emit SF for occasional jerks unless the source explicitly names myoclonic jerks or another scored
  seizure type.
- When the letter says focal seizures are completely under control after a drug change, render focal seizures
  with NumberOfSeizures='0' and PointInTime='DrugChange'.
- When the letter says seizures are significantly improved after a drug change without a count, render
  generic seizures with FrequencyChange='Infrequent' and PointInTime='DrugChange'.
- When the letter says a patient had a recent named seizure after years of seizure freedom, keep the recent
  named seizure as active-rate and do not replace it with the older seizure-free interval.
- When a named seizure-type sentence is followed by 'these seizures' with a count or range, use text 'seizures'
  for the generic counted state if the source wording does not repeat the named type.
- When a last-event phrase names focal to bilateral convulsive seizures, also render the component convulsive
  seizure seizure-free state if the letter explicitly supports it.
- When a sentence says a patient can get infrequent focal to bilateral convulsive seizures, render that
  named seizure type with FrequencyChange='Infrequent'.
- When a sentence says the last seizures were in the teenage years, render generic seizures as seizure-free
  since AgeLower='13', AgeUpper='19', AgeUnit='Year'; do not render the historical count as a current
  active-rate fact.
- If the evidence phrase is generic 'last seizures were in the teenage years', use text 'seizures' even
  when the following clause names a specific seizure type.
- Return exactly one JSON object. No markdown code fences.
worked_examples:
- note_fragment: 'Seizure type and frequency: seizures every 3 to 4 weeks. She has seizures every 3 to
    4 weeks.'
  draft:
  - text: seizures
  correct:
  - text: seizures
    attributes:
      NumberOfSeizures: '1'
      LowerNumberOfTimePeriods: '3'
      UpperNumberOfTimePeriods: '4'
      TimePeriod: Week
    evidence: seizures every 3 to 4 weeks
    confidence: high
    rationale: The seizure-type line states the rate.
  - text: seizures
    attributes:
      NumberOfSeizures: '1'
      LowerNumberOfTimePeriods: '3'
      UpperNumberOfTimePeriods: '4'
      TimePeriod: Week
    evidence: She has seizures every 3 to 4 weeks
    confidence: high
    rationale: The narrative repeats the same independent rate.
- note_fragment: He had 2 generalised tonic clonic seizures in 2014. He remains seizure free and is now
    driving.
  draft:
  - text: seizure free
  correct:
  - text: generalised tonic clonic seizures
    attributes:
      NumberOfSeizures: '2'
      TimeSince_or_TimeOfEvent: During
      YearDate: '2014'
    evidence: 2 generalised tonic clonic seizures in 2014
    confidence: high
    rationale: The historical count is the frequency fact.
- note_fragment: Unfortunately after the period of seizure freedom the seizures have returned.
  draft: []
  correct:
  - text: seizures
    attributes:
      FrequencyChange: Increased
    evidence: the seizures have returned
    confidence: medium
    rationale: Returned seizures are a generic increased-frequency state.
- note_fragment: She has not had any further seizures since her last clinic appointment and since starting
    the lamotrigine.
  draft:
