    confidence: high
    rationale: The sentence explicitly gives last-clinic seizure freedom.
  - text: seizures
    attributes:
      NumberOfSeizures: '0'
      PointInTime: DrugChange
      TimeSince_or_TimeOfEvent: Since
    evidence: not had any further seizures since her last clinic appointment and since starting the lamotrigine
    confidence: high
    rationale: The same sentence also anchors seizure freedom to treatment start.
- note_fragment: 'Seizure type and frequency: 2 generalised tonic clonic seizures 2014, absence like seizures
