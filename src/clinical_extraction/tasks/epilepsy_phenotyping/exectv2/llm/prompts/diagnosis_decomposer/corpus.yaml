# Retained verbatim for the model-transfer Diagnosis decomposer.
clinical_rules:
- Return only Diagnosis mentions. Do not emit Prescription, SF, or Investigations.
- Every final evidence value must be an exact substring of the letter.
- Diagnosis text may be a normalized core clinical concept phrase even when the source expresses it with
  hedging, punctuation, abbreviation, or discontinuous wording. The evidence must still be exact.
- Render only the core clinical concept span in text. Strip section labels, dashes, hedging words, 'single'
  in simple single-seizure phrases, and explanatory context. Do not strip 'alone' from an epilepsy-with-generalised-tonic-clonic-seizures-alone
  syndrome.
- Diagnosis clinical recovery is multi-concept. If an exact evidence span explicitly contains the word
  epilepsy, emit a generic 'epilepsy' mention with the certainty carried by that word even when the same
  span also supports focal, generalised, symptomatic structural, JME, or another more specific epilepsy
  concept.
- For diagnosis headings such as 'epilepsy - probable focal' or 'Epilepsy - unclassified, possibly generalised',
  emit both the explicit generic epilepsy concept with Certainty='5' and the uncertain specific concept
  with Certainty='4' or '3'.
- Use Certainty='4' for probable or likely diagnoses; Certainty='3' for possible, suspected, query, or
  differential diagnoses; Certainty='5' only for established or unqualified statements.
- Prefer the most specific epilepsy syndrome stated in the source, such as focal epilepsy, temporal lobe
  epilepsy, focal onset epilepsy, symptomatic structural focal epilepsy, intractable epilepsy, primary/generalised
  epilepsy, juvenile myoclonic epilepsy, or JME.
- When the source says 'Epilepsy - unclassified, possibly generalised', emit 'generalised epilepsy' with
  Certainty='3'. Do not emit generic 'epilepsy' with Certainty='3' for that phrase.
- When a narrative states 'reviewed this patient with epilepsy' or otherwise explicitly says the patient
  has epilepsy, emit a generic 'epilepsy' Diagnosis. Do not suppress this generic mention merely because
  another sentence or clause states a more specific epilepsy syndrome.
- Do not infer epilepsy from a generic clinic-review sentence, medication use, EEG confirmation, or epileptic
  events. Emit generic 'epilepsy' only when the evidence itself explicitly contains epilepsy.
- When a seizure-type/frequency line says 'seizures every ... possibly focal onset', emit 'focal onset
  epilepsy' with Certainty='3'.
- Use the exact abbreviation as text when the source says JME; do not write 'possible JME' as text.
- 'For discontinuous syndrome wording, render the normalized concept: write ''epilepsy - probable focal''
  as ''focal epilepsy'', and write ''probable temporal'' in an epilepsy diagnosis context as ''temporal
  lobe epilepsy''.'
- 'Keep named seizure types when they are asserted as seizure diagnoses: focal seizures, focal seizures
  with altered awareness, focal to bilateral convulsive seizures, tonic clonic seizures, secondary generalised
  tonic clonic seizures, complex partial seizures, absence seizures, and bilateral convulsive seizure.'
- Do not drop true named seizure types just because they occur in a seizure-type/frequency line; if the
  line names the seizure type, include the Diagnosis mention as well as any SF handled elsewhere.
- Do not deduplicate separately supported diagnosis assertions. If both a Diagnosis line and a seizure-type/frequency
  line independently assert tonic clonic seizures, return two Diagnosis mentions with their own exact
  evidence strings.
- 'Apply the same no-deduplication rule to other named seizure types: if two different source spans independently
  assert focal seizures or focal to bilateral convulsive seizures, return both mentions.'
- 'Use normalized seizure-type text for Diagnosis mentions: write ''generalised tonic clonic seizures''
  as ''tonic clonic seizures'', and write ''single focal seizure'' as ''focal seizure''. Use plural ''tonic
  clonic seizures'' for recurring, plural, or frequency-context tonic-clonic events.'
- Use singular seizure-type text when the source explicitly says one event, such as 'a generalised tonic
  clonic seizure' or 'a bilateral convulsive seizure'. Do not pluralize those one-off mentions.
- If the source states an epilepsy-with-generalised-tonic-clonic-seizures-alone syndrome, preserve the
  full syndrome as a Diagnosis text mention, add the generic 'epilepsy' concept only when the word epilepsy
  is explicit in that evidence, and add tonic-clonic seizure type mentions for each separately supported
  tonic-clonic assertion.
- If the source separately states genetic generalised epilepsy before an epilepsy-with tonic-clonic-alone
  syndrome, emit a separate 'genetic generalised epilepsy' mention. Do not merge it into the later syndrome.
- When the diagnosis line says secondary generalised tonic clonic seizures, emit both 'secondary generalised
  tonic clonic seizures' and the component 'tonic clonic seizures'. If a history line later repeats generalised
  tonic clonic seizures, emit a second 'tonic clonic seizures' mention with that separate evidence.
- For source phrases such as 'I think these are in keeping with temporal lobe onset focal seizures', emit
  seizure-type diagnoses such as 'temporal lobe seizure' and 'focal seizures' with Certainty='4'; do not
  convert them into 'temporal lobe epilepsy'.
- A bare adjective such as 'general seizures' is not a named seizure type. If a phrase says 'general and
  complex partial seizures', keep the named 'complex partial seizures' and do not emit 'general seizures'.
- Never emit generic 'seizures' as a Diagnosis mention. Generic seizure counts or rates belong to SeizureFrequency,
  not Diagnosis, unless a named seizure type is present in the same source span.
- Do not support a named seizure-type Diagnosis from generic episode or spell evidence. The evidence for
  focal, temporal, tonic-clonic, or other named seizure types must include the named type words.
- If an epilepsy diagnosis contains a parenthetical probable cause, such as 'symptomatic structural focal
  epilepsy (probable perinatal insult)', the epilepsy diagnosis remains Certainty='5'; the probable wording
  modifies the cause, not the diagnosis.
- A core diagnosis before parentheses remains established even when the parenthetical cause starts with
  probable. For example, 'Symptomatic structural focal epilepsy (probable perinatal insult)' is Certainty='5'.
- If the source says 'intractable epilepsy', keep 'intractable epilepsy' as the text; do not reduce it
  to generic epilepsy.
- When the source says symptomatic structural epilepsy due to a focal brain lesion, previous abscess,
  tumour, perinatal insult, or other structural focal cause, normalize the syndrome text to 'symptomatic
  structural focal epilepsy' with Certainty='5'.
- If the source says focal seizures are completely under control, this is still an affirmed Diagnosis
  mention for 'focal seizures'; use Certainty='4' when introduced by 'I think'.
- If the source says a combination of epileptic and nonepileptic events, normalize the epileptic side
  to 'epileptic attack' and do not emit 'epileptic events' as text.
- Never write 'tonic chronic'; preserve tonic clonic or tonic-clonic.
- Never use attribute labels such as 'MultipleSeizures' as mention text.
- Do not emit isolated symptoms or aura features as Diagnosis, including myoclonic jerks, jerks, flashing
  lights, odd sensations, altered awareness alone, dizziness, blackouts, collapse, or anxiety.
- Myoclonic jerks are not a Diagnosis mention by themselves, even when frequent. If the source also says
  possible JME, emit JME with Certainty='3' and omit myoclonic jerks.
- Do not emit dissociative, non-epileptic, or psychogenic events as an epileptic Diagnosis unless the
  evidence explicitly states they are epileptic seizures.
- For this Diagnosis extraction task, omit dissociative seizures even when they appear in a Diagnosis
  list; they are not an epileptic Diagnosis mention.
- Do not emit febrile seizures as a current epilepsy Diagnosis when they are described as remote childhood
  history or absence of history.
- 'If the letter has no requested Diagnosis mentions, return {"mentions": []}.'
- Return exactly one JSON object. No markdown code fences.
