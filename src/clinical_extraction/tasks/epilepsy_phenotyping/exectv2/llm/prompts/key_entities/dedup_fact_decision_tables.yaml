diagnosis:
- source_pattern: epilepsy heading or diagnosis line
  emit: 'the most specific epilepsy concept stated: epilepsy, focal epilepsy/focal-onset epilepsy, temporal lobe epilepsy,
    generalised epilepsy, genetic generalised epilepsy, or intractable epilepsy'
  do_not_emit: a generic epilepsy fact instead of a more specific stated epilepsy concept
- source_pattern: seizure type named in a seizure type/frequency statement
  emit: the seizure type diagnosis, e.g. focal seizures, focal seizures with altered awareness, focal to bilateral convulsive
    seizures, generalised tonic clonic seizures, complex partial seizures
  do_not_emit: an epilepsy syndrome such as focal epilepsy or temporal lobe epilepsy unless the source states that syndrome
    separately
- source_pattern: febrile seizures, dissociative/non-epileptic events, isolated jerks, migraine, syncope, blackouts, or uncertain
    attacks
  emit: nothing unless the phrase is explicitly listed as the patient's current epileptic seizure type
  do_not_emit: mimics, historical febrile seizures, or symptoms as diagnosis facts
- source_pattern: no absences/no focal seizures/no convulsive seizures
  emit: a negated diagnosis fact for the named target seizure type
  do_not_emit: an affirmed diagnosis fact for the negated phrase
seizure_frequency:
- source_pattern: explicit nonzero count, rate, cadence, or interval
  emit: state=active_rate for that exact seizure type; examples include 2 per month, twice weekly, every 3 weeks, one seizure
    last week, 3 since last clinic
  do_not_emit: active_rate without an explicit burden expression
- source_pattern: continues to get, ongoing, returned, occasional, frequent, infrequent
  emit: state=unknown only when this is a seizure type/frequency target statement; otherwise omit
  do_not_emit: active_rate, and never invent NumberOfSeizures=1 for qualitative language
- source_pattern: last event, last seizure, no seizures since, seizure-free
  emit: state=seizure_free for the named seizure type, or seizures if generic
  do_not_emit: active_rate from a last-event date
- source_pattern: same seizure type has two distinct stated states
  emit: one fact per distinct state, e.g. an infrequent/unknown state and a last-event/seizure_free state may both be present
  do_not_emit: collapse different states for the same seizure type
- source_pattern: specific seizure type and generic overall seizure statement both appear
  emit: specific seizure-type facts for specific evidence; generic seizures only for a separate overall statement
  do_not_emit: generic seizures from evidence that only names a specific seizure type
prescription:
- source_pattern: current medication/current anti-seizure medication/she is taking/she is on
  emit: each standing current anti-seizure regimen with drug, dose, unit, frequency
  do_not_emit: non-antiepileptic medicines or previous trials
- source_pattern: planned increase, taper, option, start later, reduce slowly
  emit: only the dose/frequency the patient is currently taking now
  do_not_emit: future target doses or medication-change plans
- source_pattern: can take, if necessary, rescue, PRN/as required
  emit: nothing unless the source explicitly lists it as a current standing regimen
  do_not_emit: contingency or rescue medication as ordinary current treatment
investigation:
- source_pattern: completed MRI/CT/EEG/telemetry with normal or abnormal result
  emit: the modality with result normal or abnormal
  do_not_emit: dates or planned repeat tests
- source_pattern: completed test mentioned but result not stated
  emit: the modality with result unknown
  do_not_emit: unknown for a planned or requested test
- source_pattern: arranging/requested/awaiting/repeat/planned/future test
  emit: nothing
  do_not_emit: a completed investigation fact, even with result unknown
