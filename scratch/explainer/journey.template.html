<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Journey — clinical extraction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: oklch(0.14 0.01 250);
  --surface: oklch(0.18 0.012 250);
  --surface-2: oklch(0.22 0.014 250);
  --ink: oklch(0.93 0.01 250);
  --muted: oklch(0.68 0.02 250);
  --faint: oklch(0.42 0.02 250);
  --claim: oklch(0.68 0.19 18);       /* the clinical answer */
  --claim-dim: oklch(0.42 0.12 18);
  --hands: oklch(0.72 0.09 195);      /* deterministic */
  --mind: oklch(0.78 0.12 75);        /* model */
  --score: oklch(0.72 0.1 300);
  --good: oklch(0.72 0.14 150);
  --bad: oklch(0.68 0.17 25);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.45;
  background:
    radial-gradient(900px 480px at 15% -10%, oklch(0.28 0.04 18 / .35), transparent 60%),
    radial-gradient(700px 420px at 90% 110%, oklch(0.26 0.03 195 / .3), transparent 55%),
    var(--bg);
}
a { color: var(--hands); text-decoration-thickness: 1px; text-underline-offset: 3px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--claim); outline-offset: 3px; }

.top {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 18px 28px; border-bottom: 1px solid oklch(1 0 0 / .06);
}
.top h1 {
  margin: 0; font-size: 15px; font-family: var(--mono); font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.top h1 em { font-style: normal; color: var(--ink); }
.top nav { margin-left: auto; display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; }
.top nav a { color: var(--muted); text-decoration: none; }
.top nav a:hover, .top nav a[aria-current] { color: var(--ink); }

.stage {
  display: grid;
  grid-template-columns: minmax(280px, 34vw) 1fr;
  min-height: calc(100vh - 58px);
}
@media (max-width: 960px) { .stage { grid-template-columns: 1fr; } }

.letter-pane {
  padding: 36px 28px 48px;
  border-right: 1px solid oklch(1 0 0 / .06);
  position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto;
}
.letter-pane .kicker {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 18px;
}
.paper {
  background: oklch(0.93 0.02 85);
  color: oklch(0.22 0.02 60);
  padding: 28px 26px 32px;
  box-shadow:
    0 1px 0 oklch(0 0 0 / .2),
    0 24px 48px oklch(0 0 0 / .35),
    inset 0 0 0 1px oklch(0.7 0.03 85);
  transform: rotate(-.4deg);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
}
.paper.pulse { transform: rotate(.3deg) translateY(-2px); box-shadow: 0 28px 60px oklch(0.4 0.1 18 / .25); }
.paper .from {
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  text-transform: uppercase; color: oklch(0.45 0.03 60); margin-bottom: 14px;
}
.paper .body {
  font-size: 16.5px; line-height: 1.55; margin: 0;
  white-space: pre-wrap;
}
.paper .mark {
  background: oklch(0.78 0.14 75 / .45);
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
  padding: 0 .1em;
}
.paper .gold {
  margin-top: 22px; padding-top: 14px;
  border-top: 1px dashed oklch(0.5 0.04 60);
  font-family: var(--mono); font-size: 12px; color: oklch(0.4 0.03 60);
}
.paper .gold b { color: oklch(0.25 0.04 18); font-weight: 600; }

.journey {
  padding: 32px 36px 80px;
  min-width: 0;
}
.controls {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
}
.method-pick {
  display: flex; gap: 4px; font-family: var(--mono); font-size: 12px;
  background: var(--surface); padding: 3px; border: 1px solid oklch(1 0 0 / .06);
}
.method-pick button {
  background: transparent; border: 0; color: var(--muted); padding: 7px 12px;
}
.method-pick button[aria-pressed="true"] {
  background: var(--ink); color: var(--bg);
}
.scrub {
  flex: 1; min-width: 200px; display: flex; align-items: center; gap: 12px;
}
.scrub input[type="range"] {
  flex: 1; accent-color: var(--claim); height: 2px;
}
.scrub .pos {
  font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 7ch;
}
.play {
  background: var(--claim); color: white; border: 0;
  font-family: var(--mono); font-size: 12px; padding: 8px 14px;
  letter-spacing: .04em;
}
.play[aria-pressed="true"] { background: var(--hands); color: var(--bg); }

.claim-board {
  position: relative;
  min-height: 140px;
  margin-bottom: 28px;
  padding: 22px 24px;
  background: var(--surface);
  border: 1px solid oklch(1 0 0 / .07);
  overflow: hidden;
}
.claim-board::before {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(120deg, transparent 40%, oklch(0.68 0.19 18 / .08) 50%, transparent 60%);
  transform: translateX(-100%);
  animation: none;
}
.claim-board.flash::before { animation: sweep .7s ease-out; }
@keyframes sweep {
  to { transform: translateX(100%); }
}
.claim-board .who {
  font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 8px;
}
.claim-board .who span { color: var(--mind); }
.claim-board .who span.det { color: var(--hands); }
.claim-board .who span.scorer { color: var(--score); }
.claim-board .answer {
  font-size: clamp(28px, 4vw, 44px);
  font-weight: 600;
  letter-spacing: -.02em;
  line-height: 1.1;
  color: var(--claim);
  text-wrap: balance;
  transition: color .3s, opacity .25s;
}
.claim-board .answer.unchanged { color: var(--muted); }
.claim-board .delta {
  margin-top: 10px;
  font-family: var(--mono); font-size: 12.5px; color: var(--muted);
}
.claim-board .delta b { color: var(--ink); font-weight: 500; }
.claim-board .delta .arrow { color: var(--claim); margin: 0 6px; }

.film {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px;
  scroll-snap-type: x mandatory; margin-bottom: 28px;
}
.frame {
  flex: 0 0 88px; scroll-snap-align: start;
  background: transparent; border: 1px solid oklch(1 0 0 / .1);
  color: var(--muted); padding: 10px 8px; text-align: left;
  font-family: var(--mono); font-size: 10px; min-height: 92px;
  display: flex; flex-direction: column; gap: 6px;
  transition: border-color .2s, background .2s, color .2s;
}
.frame:hover { border-color: oklch(1 0 0 / .25); color: var(--ink); }
.frame[aria-pressed="true"] {
  background: var(--surface-2); border-color: var(--claim); color: var(--ink);
}
.frame .n { color: var(--faint); }
.frame .dot {
  width: 8px; height: 8px; border-radius: 50%; margin-top: auto;
  background: var(--faint);
}
.frame.model .dot { background: var(--mind); }
.frame.det .dot { background: var(--hands); }
.frame.scorer .dot { background: var(--score); }
.frame.changed { box-shadow: inset 0 -2px 0 var(--claim); }
.frame .short { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.25; }

.focus {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
}
@media (max-width: 720px) { .focus { grid-template-columns: 1fr; } }
.panel {
  background: var(--surface); border: 1px solid oklch(1 0 0 / .07);
  padding: 18px 18px 22px; min-height: 160px;
}
.panel h2 {
  margin: 0 0 10px; font-size: 13px; font-family: var(--mono);
  font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
}
.panel .title {
  font-size: 22px; font-weight: 600; letter-spacing: -.015em;
  margin: 0 0 10px; text-wrap: balance;
}
.panel p { margin: 0 0 10px; color: var(--muted); font-size: 15.5px; }
.panel .io {
  font-family: var(--mono); font-size: 12px; line-height: 1.45;
  background: var(--bg); padding: 10px 12px; color: var(--ink);
  white-space: pre-wrap; word-break: break-word; max-height: 180px; overflow: auto;
  border: 1px solid oklch(1 0 0 / .06);
}
.panel .tag {
  display: inline-block; font-family: var(--mono); font-size: 10px;
  letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px;
  margin-right: 6px; margin-bottom: 8px;
  border: 1px solid currentColor;
}
.panel .tag.model { color: var(--mind); }
.panel .tag.deterministic { color: var(--hands); }
.panel .tag.scorer { color: var(--score); }
.panel .tag.meaning { color: var(--claim); }

.verdict {
  margin-top: 22px; padding: 16px 18px;
  border: 1px solid oklch(1 0 0 / .08);
  display: none;
}
.verdict.show { display: block; }
.verdict.ok { border-color: oklch(0.72 0.14 150 / .5); background: oklch(0.72 0.14 150 / .08); }
.verdict.bad { border-color: oklch(0.68 0.17 25 / .5); background: oklch(0.68 0.17 25 / .08); }
.verdict .label { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.verdict .big { font-size: 20px; font-weight: 600; margin-top: 4px; }

@media (prefers-reduced-motion: reduce) {
  .paper, .claim-board::before, .frame { transition: none !important; animation: none !important; }
}
</style>

<header class="top">
  <h1>Prototype · <em>Letter journey</em></h1>
  <nav>
    <a href="index.html">Hub</a>
    <a href="journey.html" aria-current="page">Journey</a>
    <a href="xray.html">X-ray</a>
    <a href="custody.html">Custody</a>
  </nav>
</header>

<div class="stage">
  <aside class="letter-pane">
    <div class="kicker" id="letter-id">The letter</div>
    <div class="paper" id="paper">
      <div class="from">Clinic correspondence · synthetic teaching letter</div>
      <p class="body" id="note"></p>
      <div class="gold">Gold answer · <b id="gold"></b></div>
    </div>
  </aside>

  <main class="journey">
    <div class="controls">
      <div class="method-pick" id="methods" role="group" aria-label="Method"></div>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="1" value="0" step="1" aria-label="Stage">
        <span class="pos" id="pos">1 / 1</span>
      </div>
      <button type="button" class="play" id="play" aria-pressed="false">Play</button>
    </div>

    <div class="claim-board" id="board">
      <div class="who">Current clinical claim · held by <span id="holder">—</span></div>
      <div class="answer" id="answer">—</div>
      <div class="delta" id="delta"></div>
    </div>

    <div class="film" id="film" role="listbox" aria-label="Stages"></div>

    <div class="focus">
      <div class="panel" id="stage-panel"></div>
      <div class="panel" id="io-panel"></div>
    </div>

    <div class="verdict" id="verdict"></div>
  </main>
</div>

<script id="explainer-data" type="application/json">__EXPLAINER_DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("explainer-data").textContent);
  var byId = {};
  DATA.manifests.forEach(function (m) { byId[m.method_id] = m; });
  var caseByTask = {};
  DATA.cases.forEach(function (c) { caseByTask[c.task] = c; });

  var GAN = ["gan2026_rules_only", "gan2026_llm_only", "gan2026_llm_with_rules"];
  var state = { method: "gan2026_llm_with_rules", i: 0, playing: false, timer: null };

  function el(t, c, x) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (x != null) n.textContent = x;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  function run() {
    var m = byId[state.method];
    var c = caseByTask[m.task];
    return c.runs.filter(function (r) { return r.method_id === state.method; })[0];
  }

  function extractClaim(text) {
    if (!text || text === "(not run)") return null;
    var m = String(text).match(/\b\d+(?:\.\d+)?\s+per\s+\w+/i);
    if (m) return m[0];
    // short label-like strings only
    if (/^(none|unknown|not stated)\b/i.test(text) && String(text).length < 40) return String(text);
    if (String(text).length <= 36 && !/prompt|payload|schema|validated|characters/i.test(text)) {
      return String(text);
    }
    return null;
  }

  function claimAt(obsList, index) {
    var claim = "—";
    for (var i = 0; i <= index; i++) {
      var o = obsList[i];
      if (!o || o.output === "(not run)") continue;
      var extracted = extractClaim(o.output);
      if (!extracted) continue;
      // Only let clinical-meaning / model / scorer stages (or clear rate strings) move the board
      if (
        o.effect_class === "clinical_meaning" ||
        o.owner === "model" ||
        o.owner === "scorer" ||
        /\bper\s+\w+/i.test(extracted)
      ) {
        claim = extracted;
      }
    }
    return claim;
  }

  function highlightEvidence(text, evidence) {
    if (!evidence || evidence.length < 4) return text;
    var idx = text.toLowerCase().indexOf(evidence.toLowerCase());
    if (idx < 0) return text;
    return text.slice(0, idx) + "«MARK»" + text.slice(idx, idx + evidence.length) + "«/MARK»" + text.slice(idx + evidence.length);
  }

  function renderMethods() {
    var host = document.getElementById("methods");
    clear(host);
    GAN.forEach(function (id) {
      var m = byId[id];
      var b = el("button", null, m.method_label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(id === state.method));
      b.addEventListener("click", function () {
        state.method = id; state.i = 0; stopPlay(); render();
      });
      host.appendChild(b);
    });
  }

  function renderFilm(manifest, obs) {
    var film = document.getElementById("film");
    clear(film);
    manifest.stages.forEach(function (s, i) {
      var o = obs[i];
      var owner = s.owner === "model" ? "model" : (s.owner === "scorer" ? "scorer" : "det");
      var f = el("button", "frame " + owner + (o && o.changed ? " changed" : ""));
      f.type = "button";
      f.setAttribute("role", "option");
      f.setAttribute("aria-pressed", String(i === state.i));
      f.appendChild(el("span", "n", String(i + 1)));
      f.appendChild(el("span", "short", s.name));
      f.appendChild(el("span", "dot"));
      f.addEventListener("click", function () { state.i = i; stopPlay(); render(); });
      film.appendChild(f);
    });
    var active = film.children[state.i];
    if (active) active.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  }

  function render() {
    var manifest = byId[state.method];
    var c = caseByTask[manifest.task];
    var r = run();
    var obs = r.observations;
    state.i = Math.max(0, Math.min(state.i, obs.length - 1));

    document.getElementById("letter-id").textContent = c.letter_id + " · " + c.task_label;
    document.getElementById("gold").textContent = c.gold;
    var evidence = "";
    for (var j = 0; j < obs.length; j++) {
      if (/evidence/i.test(obs[j].stage_name || "") && obs[j].input && obs[j].input.length < 120) {
        evidence = obs[j].input; break;
      }
    }
    var marked = highlightEvidence(c.note_text, evidence);
    var note = document.getElementById("note");
    note.textContent = "";
    marked.split(/(«MARK»|«\/MARK»)/).forEach(function (part) {
      if (part === "«MARK»" || part === "«/MARK»") return;
      // naive: wrap segments between marks — rebuild simply
    });
    // simpler highlight
    if (evidence && c.note_text.toLowerCase().indexOf(evidence.toLowerCase()) >= 0) {
      var ix = c.note_text.toLowerCase().indexOf(evidence.toLowerCase());
      note.appendChild(document.createTextNode(c.note_text.slice(0, ix)));
      var mark = el("span", "mark", c.note_text.slice(ix, ix + evidence.length));
      note.appendChild(mark);
      note.appendChild(document.createTextNode(c.note_text.slice(ix + evidence.length)));
    } else {
      note.textContent = c.note_text;
    }

    renderMethods();
    var scrub = document.getElementById("scrub");
    scrub.max = String(obs.length - 1);
    scrub.value = String(state.i);
    document.getElementById("pos").textContent = (state.i + 1) + " / " + obs.length;

    var stage = manifest.stages[state.i];
    var o = obs[state.i];
    var claim = claimAt(obs, state.i);
    var prevClaim = state.i > 0 ? claimAt(obs, state.i - 1) : "—";
    var board = document.getElementById("board");
    var ans = document.getElementById("answer");
    var holder = document.getElementById("holder");
    holder.textContent = stage.owner;
    holder.className = stage.owner === "model" ? "" : (stage.owner === "scorer" ? "scorer" : "det");
    ans.textContent = claim;
    ans.className = "answer" + (o && o.changed ? "" : " unchanged");
    var delta = document.getElementById("delta");
    if (o && o.changed && prevClaim !== claim) {
      delta.innerHTML = "";
      delta.appendChild(el("b", null, prevClaim));
      var ar = el("span", "arrow", "→");
      delta.appendChild(ar);
      delta.appendChild(el("b", null, claim));
      delta.appendChild(document.createTextNode(" · this stage rewrote the claim"));
      board.classList.remove("flash");
      void board.offsetWidth;
      board.classList.add("flash");
      document.getElementById("paper").classList.add("pulse");
      setTimeout(function () { document.getElementById("paper").classList.remove("pulse"); }, 500);
    } else if (o && o.output === "(not run)") {
      delta.textContent = "Stage skipped on this letter";
    } else {
      delta.textContent = o && o.changed ? "Representation changed; claim may be the same string." : "Claim held steady through this stage.";
    }

    renderFilm(manifest, obs);

    var sp = document.getElementById("stage-panel");
    clear(sp);
    sp.appendChild(el("h2", null, "This stage"));
    sp.appendChild(el("div", "title", stage.name));
    var tags = el("div");
    tags.appendChild(el("span", "tag " + stage.owner, stage.owner));
    if (stage.effect_class === "clinical_meaning") tags.appendChild(el("span", "tag meaning", "may change answer"));
    sp.appendChild(tags);
    sp.appendChild(el("p", null, stage.operation));

    var ip = document.getElementById("io-panel");
    clear(ip);
    ip.appendChild(el("h2", null, "On this letter"));
    ip.appendChild(el("p", null, o.note || (o.changed ? "Output diverged from input." : "Passthrough or quiet check.")));
    ip.appendChild(el("div", "io", "IN  " + (o.input || "—") + "\n\nOUT " + (o.output || "—")));

    var v = document.getElementById("verdict");
    if (state.i === obs.length - 1) {
      v.className = "verdict show " + (r.correct ? "ok" : "bad");
      clear(v);
      v.appendChild(el("div", "label", r.correct ? "Matches gold" : "Does not match gold"));
      v.appendChild(el("div", "big", r.final_answer));
    } else {
      v.className = "verdict";
    }
  }

  function stopPlay() {
    state.playing = false;
    document.getElementById("play").setAttribute("aria-pressed", "false");
    document.getElementById("play").textContent = "Play";
    if (state.timer) { clearInterval(state.timer); state.timer = null; }
  }

  document.getElementById("scrub").addEventListener("input", function (e) {
    state.i = Number(e.target.value); stopPlay(); render();
  });
  document.getElementById("play").addEventListener("click", function () {
    if (state.playing) { stopPlay(); return; }
    state.playing = true;
    document.getElementById("play").setAttribute("aria-pressed", "true");
    document.getElementById("play").textContent = "Pause";
    state.timer = setInterval(function () {
      var len = run().observations.length;
      if (state.i >= len - 1) { stopPlay(); return; }
      state.i += 1; render();
    }, 900);
  });

  render();
})();
</script>
