[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-extraction"
version = "0.1.0"
description = "Hybrid deterministic-LLM pipelines for structured extraction from clinical notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Clinical Extraction Contributors" }]
dependencies = [
  "dspy>=2.5.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0",
  "openai>=1.0.0",
]

[project.scripts]
gan2026-llm-experiment = "clinical_extraction.tasks.seizure_frequency.gan2026.cli.llm_pipeline_cli:main"
clinical-extract = "clinical_extraction.operational.cli:main"
trace-explorer-index = "clinical_extraction.trace_explorer.index:main"
trace-explorer = "clinical_extraction.trace_explorer.api.app:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0",
  "pandas>=2.2.0",
  "jupyter>=1.0.0",
]
trace-ui = [
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "uvicorn==0.49.0",
]
[tool.hatch.build.targets.wheel]
packages = ["src/clinical_extraction"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "data",
  "literature",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E501", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore:The 'prefix' argument in InputField/OutputField is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true
