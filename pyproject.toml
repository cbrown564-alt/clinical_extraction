[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-extraction"
version = "0.1.0"
description = "Hybrid deterministic-LLM pipelines for structured extraction from clinical notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Clinical Extraction Contributors" }]
dependencies = [
  "dspy>=2.5.0",
  "pydantic>=2.7.0",
  "pandas>=2.2.0",
  "jupyter>=1.0.0",
]

[project.scripts]
gan2026-llm-experiment = "clinical_extraction.tasks.seizure_frequency.gan2026.llm_pipeline_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_extraction"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "data",
  "literature",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
