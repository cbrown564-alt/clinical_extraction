<!DOCTYPE html>
<meta charset="utf-8">
<title>Stage Ladder — clinical extraction</title>
<style>
:root {
  --paper: #f4f6f7; --panel: #ffffff; --panel-2: #eef1f3;
  --ink: #14181b; --ink-2: #4a5257; --ink-3: #79838a;
  --rule: #dde2e5; --rule-2: #c7ced2;
  --model: #a6522a; --model-bg: #f3e6dd;
  --det: #2c6a6d; --det-bg: #dfeceb;
  --scorer: #6b5a93; --scorer-bg: #e8e4f0;
  --focus: #16639e;
  --good: #2f7a4d; --bad: #a33a34;
  --mono: ui-monospace, "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", "Roboto Mono", monospace;
  --sans: "Segoe UI Variable Text", "Segoe UI", -apple-system, Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1214; --panel: #161a1d; --panel-2: #1d2225;
    --ink: #e8ecee; --ink-2: #a4aeb4; --ink-3: #6f7b82;
    --rule: #262d31; --rule-2: #384247;
    --model: #d9895d; --model-bg: #2e211a;
    --det: #5fada9; --det-bg: #16292a;
    --scorer: #a795d0; --scorer-bg: #221e30;
    --focus: #62aae8;
    --good: #5fb27f; --bad: #d97b74;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1214; --panel: #161a1d; --panel-2: #1d2225;
  --ink: #e8ecee; --ink-2: #a4aeb4; --ink-3: #6f7b82;
  --rule: #262d31; --rule-2: #384247;
  --model: #d9895d; --model-bg: #2e211a;
  --det: #5fada9; --det-bg: #16292a;
  --scorer: #a795d0; --scorer-bg: #221e30;
  --focus: #62aae8;
  --good: #5fb27f; --bad: #d97b74;
}
:root[data-theme="light"] {
  --paper: #f4f6f7; --panel: #ffffff; --panel-2: #eef1f3;
  --ink: #14181b; --ink-2: #4a5257; --ink-3: #79838a;
  --rule: #dde2e5; --rule-2: #c7ced2;
  --model: #a6522a; --model-bg: #f3e6dd;
  --det: #2c6a6d; --det-bg: #dfeceb;
  --scorer: #6b5a93; --scorer-bg: #e8e4f0;
  --focus: #16639e;
  --good: #2f7a4d; --bad: #a33a34;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }

.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3); }
.mono { font-family: var(--mono); font-size: 12.5px; }

/* ---- masthead ---- */
header.top { border-bottom: 1px solid var(--rule); background: var(--panel);
  position: sticky; top: 0; z-index: 20; }
.top-inner { display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
  padding: 14px 22px; }
.top h1 { font-size: 17px; margin: 0; font-weight: 640; letter-spacing: -.01em; }
.top h1 span { color: var(--ink-3); font-weight: 400; }
.top .spacer { flex: 1; }
nav.proto { display: flex; gap: 2px; font-family: var(--mono); font-size: 11.5px; }
nav.proto span, nav.proto a { padding: 4px 9px; border: 1px solid var(--rule);
  text-decoration: none; color: var(--ink-2); }
nav.proto span[aria-current] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---- layout ---- */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr) minmax(0, 400px);
  gap: 0; align-items: start; }
@media (max-width: 1100px) { .shell { grid-template-columns: 1fr; } }

aside.rail { border-right: 1px solid var(--rule); padding: 20px 16px; position: sticky; top: 52px;
  max-height: calc(100vh - 52px); overflow-y: auto; }
.rail-group { margin-bottom: 22px; }
.rail-group > .eyebrow { display: block; margin-bottom: 8px; }
.chip { display: block; width: 100%; text-align: left; background: transparent;
  border: 1px solid var(--rule); color: var(--ink); font: inherit; font-size: 13.5px;
  padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
.chip:hover { border-color: var(--rule-2); background: var(--panel-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip small { display: block; font-family: var(--mono); font-size: 10.5px; opacity: .7; }

main.center { padding: 22px 26px 80px; min-width: 0; }
.head-block { max-width: 62ch; margin-bottom: 20px; }
.head-block h2 { font-size: 22px; margin: 4px 0 8px; letter-spacing: -.015em; text-wrap: balance; }
.head-block p { color: var(--ink-2); margin: 0 0 8px; }

.modes { display: inline-flex; border: 1px solid var(--rule); margin-bottom: 18px;
  font-family: var(--mono); font-size: 11.5px; }
.modes button { background: transparent; border: 0; color: var(--ink-2); font: inherit;
  padding: 6px 12px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.letter { border: 1px solid var(--rule); background: var(--panel); padding: 14px 16px;
  margin-bottom: 20px; }
.letter p.note { font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap;
  margin: 8px 0; color: var(--ink); }
.letter .gold { font-size: 13px; color: var(--ink-2); }
.letter .gold b { font-family: var(--mono); color: var(--ink); }

/* ---- ladder ---- */
ol.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li.rung { position: relative; padding-left: 30px; }
li.rung::before { content: ""; position: absolute; left: 9px; top: 0; bottom: 0;
  width: 1px; background: var(--rule-2); }
li.rung:first-child::before { top: 18px; }
li.rung:last-child::before { bottom: calc(100% - 18px); }
.node { position: absolute; left: 4px; top: 13px; width: 11px; height: 11px;
  border-radius: 50%; background: var(--paper); border: 2px solid var(--det); }
.node.model { border-color: var(--model); background: var(--model); }
.node.scorer { border-color: var(--scorer); }
button.rung-btn { display: block; width: 100%; text-align: left; background: var(--panel);
  border: 1px solid var(--rule); border-left-width: 3px; border-left-color: var(--rule);
  color: var(--ink); font: inherit; padding: 9px 12px; margin-bottom: 6px; cursor: pointer; }
button.rung-btn:hover { border-color: var(--rule-2); border-left-color: var(--rule-2); }
button.rung-btn.meaning { border-left-color: var(--model); }
button.rung-btn.meaning.det { border-left-color: var(--det); }
button.rung-btn[aria-pressed="true"] { background: var(--panel-2); border-color: var(--ink);
  border-left-color: var(--ink); }
.rung-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.rung-idx { font-family: var(--mono); font-size: 11px; color: var(--ink-3); min-width: 18px; }
.rung-name { font-weight: 560; font-size: 14px; }
.rung-id { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.tag { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 6px; border: 1px solid currentColor; white-space: nowrap; }
.tag.model { color: var(--model); background: var(--model-bg); }
.tag.deterministic { color: var(--det); background: var(--det-bg); }
.tag.scorer { color: var(--scorer); background: var(--scorer-bg); }
.tag.ghost { color: var(--ink-3); background: transparent; border-style: dashed; }
.tag.flat { color: var(--ink-3); border-color: var(--rule-2); }

.io { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center;
  margin-top: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.io .cell { background: var(--panel-2); padding: 5px 7px; overflow-x: auto; white-space: pre;
  border: 1px solid var(--rule); }
.io .arrow { color: var(--ink-3); }
.io.changed .cell:last-child { border-color: var(--model); color: var(--ink); }
.unchanged-note { font-size: 11.5px; color: var(--ink-3); font-family: var(--mono); margin-top: 6px; }

.verdict { border: 1px solid var(--rule); border-top-width: 3px; background: var(--panel);
  padding: 14px 16px; margin-top: 18px; }
.verdict.correct { border-top-color: var(--good); }
.verdict.wrong { border-top-color: var(--bad); }
.verdict h3 { margin: 0 0 6px; font-size: 15px; }
.verdict .answer { font-family: var(--mono); font-size: 16px; }
.verdict p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; }

/* ---- inspector ---- */
aside.inspector { border-left: 1px solid var(--rule); background: var(--panel);
  padding: 20px 18px 60px; position: sticky; top: 52px; max-height: calc(100vh - 52px);
  overflow-y: auto; }
@media (max-width: 1100px) { aside.inspector, aside.rail { position: static; max-height: none;
  border: 0; border-top: 1px solid var(--rule); } }
.inspector h3 { font-size: 16px; margin: 6px 0 2px; letter-spacing: -.01em; text-wrap: balance; }
.field { margin-top: 16px; }
.field > .eyebrow { display: block; margin-bottom: 4px; }
.field p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.field code, .code { display: block; font-family: var(--mono); font-size: 11.5px;
  background: var(--panel-2); border: 1px solid var(--rule); padding: 6px 8px;
  overflow-x: auto; white-space: pre-wrap; word-break: break-all; color: var(--ink); }
.empty { color: var(--ink-3); font-size: 13.5px; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-2);
  font-family: var(--mono); margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--rule);
  background: var(--panel); }
.legend i { font-style: normal; display: inline-block; width: 9px; height: 9px; margin-right: 5px;
  border-radius: 50%; vertical-align: baseline; }
.footnote { max-width: 68ch; margin: 28px 0 0; font-size: 12.5px; color: var(--ink-3); }
</style>

<header class="top">
  <div class="top-inner">
    <h1>Stage ladder <span>/ six selected methods</span></h1>
    <div class="spacer"></div>
    <nav class="proto" aria-label="Prototypes">
      <a href="map.html">1 · Map</a>
      <span aria-current="page">2 · Ladder</span>
      <a href="console.html">3 · Console</a>
    </nav>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="center">
    <div class="head-block">
      <span class="eyebrow" id="task-label"></span>
      <h2 id="method-title"></h2>
      <p id="method-sentence"></p>
    </div>

    <div class="modes" role="group" aria-label="View mode">
      <button type="button" id="mode-spec" aria-pressed="true">Manifest</button>
      <button type="button" id="mode-run" aria-pressed="false">Worked example</button>
    </div>

    <div class="legend">
      <span><i style="background: var(--model)"></i>model owns it</span>
      <span><i style="background: var(--det)"></i>deterministic</span>
      <span><i style="background: var(--scorer)"></i>scorer</span>
      <span>thick left edge = may change the clinical answer</span>
    </div>

    <div id="letter"></div>
    <ol class="ladder" id="ladder"></ol>
    <div id="verdict"></div>

    <p class="footnote" id="footnote"></p>
  </main>
  <aside class="inspector" id="inspector"></aside>
</div>

<script id="explainer-data" type="application/json">__EXPLAINER_DATA__</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("explainer-data").textContent);
  var byId = {};
  DATA.manifests.forEach(function (m) { byId[m.method_id] = m; });
  var caseByTask = {};
  DATA.cases.forEach(function (c) { caseByTask[c.task] = c; });

  var state = { method: "gan2026_llm_with_rules", mode: "spec", stage: 0 };

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  var EFFECT_LABEL = {
    transport_or_schema: "transport/schema",
    representation: "representation",
    clinical_meaning: "clinical meaning",
    benchmark_projection: "benchmark projection",
    validation_gate: "gate"
  };
  var EFFECT_HELP = {
    transport_or_schema: "Changes shape only. Cannot change which clinical answer is expressed.",
    representation: "Changes how a fact is written down, not which fact it is.",
    clinical_meaning: "May change the clinical answer: a different label, event, or finding.",
    benchmark_projection: "Projects a settled answer into a scorer-facing view. Moves the number, not the answer.",
    validation_gate: "Accepts or rejects. Cannot rewrite an answer, but can drop one out of scoring."
  };

  /* ---------------- rail ---------------- */
  function buildRail() {
    var rail = document.getElementById("rail");
    clear(rail);
    [["gan2026", "Gan 2026", "one current frequency label"],
     ["exectv2", "ExECTv2", "four families of facts"]].forEach(function (task) {
      var group = el("div", "rail-group");
      var label = el("span", "eyebrow", task[1] + " — " + task[2]);
      group.appendChild(label);
      DATA.manifests.filter(function (m) { return m.task === task[0]; })
        .forEach(function (m) {
          var b = el("button", "chip");
          b.type = "button";
          b.setAttribute("aria-pressed", String(m.method_id === state.method));
          b.appendChild(document.createTextNode(m.method_label));
          var s = el("small", null, m.stages.length + " stages");
          b.appendChild(s);
          b.addEventListener("click", function () {
            state.method = m.method_id; state.stage = 0; render();
          });
          group.appendChild(b);
        });
      rail.appendChild(group);
    });
  }

  /* ---------------- ladder ---------------- */
  function observationsFor(manifest) {
    var c = caseByTask[manifest.task];
    if (!c) return null;
    var run = c.runs.filter(function (r) { return r.method_id === manifest.method_id; })[0];
    return run || null;
  }

  function renderLadder(manifest, run) {
    var list = document.getElementById("ladder");
    clear(list);
    manifest.stages.forEach(function (stage, index) {
      var obs = run ? run.observations[index] : null;
      var li = el("li", "rung");
      var node = el("span", "node " + stage.owner);
      li.appendChild(node);

      var btn = el("button", "rung-btn");
      btn.type = "button";
      btn.setAttribute("aria-pressed", String(index === state.stage));
      if (stage.effect_class === "clinical_meaning") {
        btn.classList.add("meaning");
        if (stage.owner !== "model") btn.classList.add("det");
      }
      var top = el("div", "rung-top");
      top.appendChild(el("span", "rung-idx", String(index + 1)));
      top.appendChild(el("span", "rung-name", stage.name));
      top.appendChild(el("span", "tag " + stage.owner, stage.owner));
      var eff = el("span", "tag " + (stage.effect_class === "clinical_meaning" ? "flat" : "ghost"),
        EFFECT_LABEL[stage.effect_class] || stage.effect_class);
      top.appendChild(eff);
      btn.appendChild(top);

      if (state.mode === "run" && obs) {
        if (obs.output === "(not run)") {
          btn.appendChild(el("div", "unchanged-note", "not run on this letter — " + (obs.note || "conditional stage")));
        } else {
          var io = el("div", "io" + (obs.changed ? " changed" : ""));
          io.appendChild(el("div", "cell", obs.input));
          io.appendChild(el("div", "arrow", obs.changed ? "→ changed →" : "→"));
          io.appendChild(el("div", "cell", obs.output));
          btn.appendChild(io);
        }
      } else {
        btn.appendChild(el("div", "unchanged-note", stage.stage_id));
      }

      btn.addEventListener("click", function () { state.stage = index; render(); });
      li.appendChild(btn);
      list.appendChild(li);
    });
  }

  /* ---------------- inspector ---------------- */
  function field(parent, label, value, mono) {
    if (!value) return;
    var f = el("div", "field");
    f.appendChild(el("span", "eyebrow", label));
    f.appendChild(el(mono ? "div" : "p", mono ? "code" : null, value));
    parent.appendChild(f);
  }

  function renderInspector(manifest, run) {
    var box = document.getElementById("inspector");
    clear(box);
    var stage = manifest.stages[state.stage];
    var obs = run ? run.observations[state.stage] : null;

    box.appendChild(el("span", "eyebrow", "Stage " + (state.stage + 1) + " of " + manifest.stages.length));
    box.appendChild(el("h3", null, stage.name));
    box.appendChild(el("div", "mono", stage.stage_id));

    var tags = el("div", "field");
    var t1 = el("span", "tag " + stage.owner, stage.owner);
    tags.appendChild(t1);
    tags.appendChild(document.createTextNode(" "));
    tags.appendChild(el("span", "tag ghost", EFFECT_LABEL[stage.effect_class] || stage.effect_class));
    box.appendChild(tags);

    field(box, "What it does", stage.operation);
    field(box, "Effect class", EFFECT_HELP[stage.effect_class] || "");
    if (obs && state.mode === "run") {
      field(box, "On this letter — in", obs.input, true);
      field(box, "On this letter — out", obs.output, true);
      if (obs.note) field(box, "Note", obs.note);
    } else {
      field(box, "Input example", stage.input_example, true);
      field(box, "Output example", stage.output_example, true);
    }
    field(box, "Implemented in", stage.implementation.symbol, true);
    field(box, "Governing test", stage.governing_test, true);
    if (stage.trace_fields && stage.trace_fields.length) {
      field(box, "Trace fields", stage.trace_fields.join("\n"), true);
    }
    field(box, "How the paper words it", stage.paper_wording);
  }

  /* ---------------- letter + verdict ---------------- */
  function renderLetter(manifest, run) {
    var box = document.getElementById("letter");
    var verdict = document.getElementById("verdict");
    clear(box); clear(verdict);
    if (state.mode !== "run") return;
    var c = caseByTask[manifest.task];
    if (!c || !run) return;

    var card = el("div", "letter");
    card.appendChild(el("span", "eyebrow", "The letter — " + c.letter_id + " (synthetic)"));
    card.appendChild(el("p", "note", c.note_text));
    var gold = el("p", "gold");
    gold.appendChild(document.createTextNode("Gold answer: "));
    gold.appendChild(el("b", null, c.gold));
    card.appendChild(gold);
    if (c.gold_note) card.appendChild(el("p", "gold", c.gold_note));
    box.appendChild(card);

    var v = el("div", "verdict " + (run.correct ? "correct" : "wrong"));
    v.appendChild(el("span", "eyebrow", run.correct ? "Matches gold" : "Does not match gold"));
    v.appendChild(el("h3", null, "This method answered"));
    v.appendChild(el("div", "answer", run.final_answer));
    if (run.correctness_note) v.appendChild(el("p", null, run.correctness_note));
    v.appendChild(el("p", null, "Owner of the answer: " + run.prediction_owner));
    verdict.appendChild(v);
  }

  /* ---------------- render ---------------- */
  function render() {
    var manifest = byId[state.method];
    var run = observationsFor(manifest);
    buildRail();
    document.getElementById("task-label").textContent =
      manifest.task_label + " · " + manifest.method_label;
    document.getElementById("method-title").textContent = manifest.one_sentence;
    document.getElementById("method-sentence").textContent = manifest.sixty_second;
    document.getElementById("mode-spec").setAttribute("aria-pressed", String(state.mode === "spec"));
    document.getElementById("mode-run").setAttribute("aria-pressed", String(state.mode === "run"));
    document.getElementById("mode-run").disabled = !run;
    renderLetter(manifest, run);
    renderLadder(manifest, run);
    renderInspector(manifest, run);
    document.getElementById("footnote").textContent =
      "Scored representation: " + manifest.scored_representation +
      "  ·  Manifest: " + manifest.manifest_path +
      "  ·  Worked example builds by running the real code on a synthetic letter with fixture model output. No model calls, no locked rows.";
  }

  document.getElementById("mode-spec").addEventListener("click", function () {
    state.mode = "spec"; render();
  });
  document.getElementById("mode-run").addEventListener("click", function () {
    state.mode = "run"; render();
  });
  render();
})();
</script>
