name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,trace-ui]"
      - name: Documentation hygiene
        id: hygiene
        continue-on-error: true
        run: python scripts/checks/check_doc_hygiene.py
      - name: Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check src tests
      - name: Mypy
        id: mypy
        continue-on-error: true
        run: python -m mypy src
      - name: Pytest
        id: pytest
        continue-on-error: true
        run: python -m pytest -q
      - name: Fail if any check failed
        if: always()
        run: |
          echo "hygiene=${{ steps.hygiene.outcome }}"
          echo "ruff=${{ steps.ruff.outcome }}"
          echo "mypy=${{ steps.mypy.outcome }}"
          echo "pytest=${{ steps.pytest.outcome }}"
          if [ "${{ steps.hygiene.outcome }}" != "success" ] \
            || [ "${{ steps.ruff.outcome }}" != "success" ] \
            || [ "${{ steps.mypy.outcome }}" != "success" ] \
            || [ "${{ steps.pytest.outcome }}" != "success" ]; then
            echo "One or more checks failed."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npm run lint
      - name: Verify Next recovery build
        run: npm run build
        env:
          VERCEL: "1"
      - name: Verify public Cloudflare package
        run: npm run build:cloudflare -- migration-preview
      - name: Exercise packaged Worker
        run: npm run test:cloudflare
      - name: Validate deployment package
        run: npx cf deploy --prebuilt --mode migration-preview --dry-run
