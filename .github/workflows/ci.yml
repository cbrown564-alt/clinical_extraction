# Wave C Sprint 1 — thermo-nuclear code quality gates + fast backend pytest.
#
# backend-fast-tests: curated contract/unit subset (~145 tests, <1 min locally).
#   - ExECTv2 prediction schema drift guard + data loaders
#   - Gan2026 core pipeline v1 behavior
#   - Small shared scoring, labels, entry-point, and contract tests
# line-count-gates: production LOC limits + gate-behavior pytest (separate).
# sf-registry-parity: legacy↔registry shadow diff on standard dictionary cases.
# Full suite is too slow for every PR; run broadly on main/nightly if needed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npx jest

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  line-count-gates:
    name: Line-count gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Enforce line-count limits (src, tests, frontend)
        run: python scripts/check_line_counts.py

      - name: Enforce artifact_analysis import quarantine
        run: python scripts/check_artifact_analysis_imports.py

      - name: Pytest — line-count gate behavior
        run: python -m pytest tests/test_line_count_gates.py -q

  sf-registry-parity:
    name: SF registry parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Pytest — legacy↔registry shadow diff
        run: python -m pytest tests/test_exectv2_sf_surface_registry.py -k shadow_diff -q

  backend-fast-tests:
    name: Backend fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      # Curated fast subset: contract guards, core Gan2026 pipeline, small unit
      # tests. Excludes line-count gates (line-count-gates job), LLM replay
      # fixtures, and megatest modules (>800 LOC).
      - name: Pytest — fast backend subset
        run: |
          python -m pytest \
            tests/test_exectv2_contract.py \
            tests/test_gan2026_pipeline_v1.py \
            tests/test_core_scoring.py \
            tests/test_project_entry_points.py \
            tests/test_gan2026_labels.py \
            tests/test_gan2026_clinical_assessment_contract.py \
            tests/test_gan2026_candidate_set_contract.py \
            tests/test_exectv2_data.py \
            -q
